appId: com.melody.player
productName: Melody
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
